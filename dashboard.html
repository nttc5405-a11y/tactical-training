<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訓練儀表板</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  :root{
    --bg:#0f0f0f;--surface:#1a1a1a;--card:#222;--border:#2e2e2e;
    --accent:#e8ff00;--accent2:#ff4d00;--text:#f0f0f0;--muted:#888;
  }
  :root.light{
    --bg:#f7f7f5;--surface:#ffffff;--card:#ffffff;--border:#dcdcdc;
    --accent:#b8860b;--accent2:#c1440e;--text:#1a1a1a;--muted:#6b6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding-bottom:40px;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:var(--accent);margin-right:auto;}
  .logo span{color:var(--text);}
  select,.icon-btn,.back-link{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:0.8rem;font-family:inherit;cursor:pointer;text-decoration:none;}
  select{max-width:130px;}
  .icon-btn:hover,.back-link:hover{border-color:var(--accent);color:var(--accent);}
  .wrap{max-width:900px;margin:0 auto;padding:12px 16px;}
  .notice{margin-bottom:12px;padding:10px 12px;border:1px solid var(--accent2);border-radius:8px;font-size:0.8rem;line-height:1.6;background:rgba(255,77,0,0.08);}
  .notice.hidden{display:none;}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .stat .val{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;color:var(--accent);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat .lbl{font-size:0.62rem;color:var(--muted);margin-top:3px;}
  .chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;}
  .chart-wrap.hidden{display:none;}
  table{width:100%;border-collapse:collapse;font-size:0.8rem;}
  thead th{color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:500;font-size:0.7rem;}
  tbody td{padding:7px 8px;border-bottom:1px solid var(--border);}
  td.num{text-align:right;white-space:nowrap;}
  .weight-cell{color:var(--accent);font-weight:700;}
  .sub{color:var(--muted);font-size:0.68rem;}
  .more-btn{display:block;width:100%;margin-top:10px;padding:8px;background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-family:inherit;font-size:0.78rem;cursor:pointer;}
  .more-btn:hover{color:var(--accent);border-color:var(--accent);}
  .empty-state{padding:40px 10px;text-align:center;color:var(--muted);font-size:0.85rem;line-height:1.8;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">TRAIN<span>BLOCK</span></div>
  <select id="filterName"><option value="">全部人員</option></select>
  <select id="filterExercise"><option value="">動作（看趨勢）</option></select>
  <button class="icon-btn" onclick="loadData()" title="重新整理">🔄</button>
  <button class="icon-btn" onclick="toggleLightMode()" id="lightModeBtn" title="切換日夜">☀️</button>
  <a href="index.html" class="back-link">← 課表</a>
</div>

<div class="wrap">
  <div id="setupNotice" class="notice hidden">
    ⚠️ 尚未設定 GAS_URL：請在 <code>dashboard.html</code> 的 <code>const GAS_URL = ''</code> 貼上與 index.html 相同的 Apps Script 網址。
  </div>
  <div class="summary" id="summary"></div>
  <div class="chart-wrap hidden" id="chartWrap"><canvas id="weightChart" height="120"></canvas></div>
  <table id="dataTable" style="display:none;">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <button class="more-btn" id="moreBtn" style="display:none;" onclick="showLimit+=PAGE_SIZE;render()"></button>
  <div id="emptyState" class="empty-state">載入中…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
// 請貼上跟 index.html 相同的 Google Apps Script 網址（見「設定說明.md」）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxw-Al9rSxqvMgk0LWXKZG0jujZbaOtXUqNoG3XaQie3wG7fAUpLZEIGY30ErmRiEoh/exec';

const CHART_COLORS=['#e8ff00','#ff4d4d','#4dd0ff','#ff4de0','#4dff88','#ffb84d'];
let allRecords = [];
let weightChart = null;
const PAGE_SIZE=20;
let showLimit=PAGE_SIZE;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function applyLightMode(on){
  document.documentElement.classList.toggle('light',on);
  const btn=document.getElementById('lightModeBtn');
  if(btn)btn.textContent=on?'🌙':'☀️';
}
function toggleLightMode(){
  const on=!document.documentElement.classList.contains('light');
  localStorage.setItem('trainblock_light',on?'1':'0');
  applyLightMode(on);
  if(allRecords.length)render(); // 重畫圖表以套用新配色
}

async function loadData(){
  const empty=document.getElementById('emptyState');
  const table=document.getElementById('dataTable');
  if(!GAS_URL){
    document.getElementById('setupNotice').classList.remove('hidden');
    table.style.display='none';
    empty.style.display='none';
    return;
  }
  empty.textContent='載入中…';
  empty.style.display='block';
  table.style.display='none';
  try{
    const res=await fetch(GAS_URL+'?data=1');
    const json=await res.json();
    if(json.status!=='ok')throw new Error(json.message||'讀取失敗');
    allRecords=json.records||[];
    populateNameFilter();
    populateExerciseFilter();
    render();
  }catch(err){
    empty.innerHTML=`讀取失敗：${escapeHtml(err.message)}<br>請確認 Apps Script 是否已部署為「任何人可存取」，且網址正確。`;
    empty.style.display='block';
    table.style.display='none';
  }
}

function populateNameFilter(){
  const sel=document.getElementById('filterName');
  const cur=sel.value;
  const names=[...new Set(allRecords.map(r=>r.name).filter(Boolean))].sort();
  sel.innerHTML='<option value="">全部人員</option>'+names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  sel.value=names.includes(cur)?cur:'';
}

function populateExerciseFilter(){
  const nameSel=document.getElementById('filterName').value;
  const sel=document.getElementById('filterExercise');
  const cur=sel.value;
  const pool=allRecords.filter(r=>!nameSel||r.name===nameSel);
  const names=[...new Set(pool.flatMap(r=>(r.exercises||[]).map(e=>e.name)))].sort();
  sel.innerHTML='<option value="">動作（看趨勢）</option>'+names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  sel.value=names.includes(cur)?cur:'';
}

function getFilteredRows(){
  const name=document.getElementById('filterName').value;
  const exercise=document.getElementById('filterExercise').value;
  const rows=[];
  allRecords.forEach(r=>{
    if(name&&r.name!==name)return;
    (r.exercises||[]).forEach(ex=>{
      if(exercise&&ex.name!==exercise)return;
      rows.push({
        date:r.date,time:r.time,unit:r.unit,name:r.name,
        week:r.week,dayLabel:r.dayLabel,
        exName:ex.name,weight:ex.weight,doneSets:ex.doneSets,totalSets:ex.totalSets
      });
    });
  });
  rows.sort((a,b)=>String(a.date+a.time).localeCompare(String(b.date+b.time)));
  return rows;
}

function getCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function buildChart(rows){
  const wrap=document.getElementById('chartWrap');
  const exercise=document.getElementById('filterExercise').value;
  const weighted=exercise?rows.filter(r=>r.weight>0):[];

  if(!exercise||!weighted.length){
    wrap.classList.add('hidden');
    if(weightChart){weightChart.destroy();weightChart=null;}
    return;
  }

  const dateLabels=[...new Set(weighted.map(r=>r.date))];
  const byName={};
  weighted.forEach(r=>{
    if(!byName[r.name])byName[r.name]={};
    byName[r.name][r.date]=r.weight;
  });
  const names=Object.keys(byName);
  const datasets=names.map((n,i)=>({
    label:n,
    data:dateLabels.map(d=>byName[n][d]!=null?byName[n][d]:null),
    borderColor:CHART_COLORS[i%CHART_COLORS.length],
    backgroundColor:CHART_COLORS[i%CHART_COLORS.length],
    spanGaps:true,
    tension:0.25,
    pointRadius:4,
    pointHoverRadius:6
  }));

  wrap.classList.remove('hidden');
  const muted=getCssVar('--muted'),border=getCssVar('--border'),text=getCssVar('--text'),accent=getCssVar('--accent');
  if(weightChart)weightChart.destroy();
  weightChart=new Chart(document.getElementById('weightChart').getContext('2d'),{
    type:'line',
    data:{labels:dateLabels,datasets},
    options:{
      responsive:true,
      interaction:{mode:'nearest',intersect:false},
      plugins:{
        legend:{display:names.length>1,labels:{color:text,boxWidth:10,font:{size:11}}},
        title:{display:true,text:`${exercise} 重量趨勢（kg）`,color:accent,font:{size:12}}
      },
      scales:{
        x:{ticks:{color:muted},grid:{color:border}},
        y:{ticks:{color:muted},grid:{color:border},title:{display:true,text:'kg',color:muted}}
      }
    }
  });
}

function render(){
  const rows=getFilteredRows();
  const table=document.getElementById('dataTable');
  const empty=document.getElementById('emptyState');
  const summary=document.getElementById('summary');
  const moreBtn=document.getElementById('moreBtn');

  if(!rows.length){
    table.style.display='none';moreBtn.style.display='none';
    empty.textContent='📭 沒有符合篩選條件的紀錄';
    empty.style.display='block';
    summary.innerHTML='';
    buildChart([]);
    return;
  }

  const uniqueDays=new Set(rows.map(r=>r.date+r.name)).size;
  const weights=rows.map(r=>r.weight).filter(w=>w>0);
  const maxWeight=weights.length?Math.max(...weights):0;
  const latest=rows[rows.length-1];

  summary.innerHTML=`
    <div class="stat"><div class="val">${uniqueDays}</div><div class="lbl">訓練天數</div></div>
    <div class="stat"><div class="val">${maxWeight>0?maxWeight+'kg':'—'}</div><div class="lbl">最大重量</div></div>
    <div class="stat"><div class="val">${escapeHtml(String(latest.date).slice(5)||latest.date)}</div><div class="lbl">最近訓練</div></div>`;

  const showName=!document.getElementById('filterName').value;
  const showEx=!document.getElementById('filterExercise').value;
  document.getElementById('tableHead').innerHTML=
    `<th>日期</th>${showName?'<th>姓名</th>':''}${showEx?'<th>動作</th>':''}<th class="num">重量</th><th class="num">組數</th>`;

  const recent=rows.slice().reverse();
  const shown=recent.slice(0,showLimit);
  document.getElementById('tableBody').innerHTML=shown.map(r=>`
    <tr>
      <td>${escapeHtml(String(r.date).slice(5)||r.date)}<div class="sub">W${escapeHtml(r.week)} ${escapeHtml(r.dayLabel)}</div></td>
      ${showName?`<td>${escapeHtml(r.name)}<div class="sub">${escapeHtml(r.unit)}</div></td>`:''}
      ${showEx?`<td>${escapeHtml(r.exName)}</td>`:''}
      <td class="num weight-cell">${r.weight>0?r.weight+'kg':'—'}</td>
      <td class="num">${r.doneSets}/${r.totalSets}</td>
    </tr>`).join('');

  const rest=recent.length-shown.length;
  moreBtn.style.display=rest>0?'block':'none';
  moreBtn.textContent=`顯示更多（尚有 ${rest} 筆）`;

  empty.style.display='none';
  table.style.display='table';
  buildChart(rows);
}

document.getElementById('filterName').addEventListener('change',()=>{showLimit=PAGE_SIZE;populateExerciseFilter();render();});
document.getElementById('filterExercise').addEventListener('change',()=>{showLimit=PAGE_SIZE;render();});

applyLightMode(localStorage.getItem('trainblock_light')==='1');
loadData();
</script>
</body>
</html>
